requiredVersions:
  azd: '>=1.21.2'
name: nlweb-agent-demo
services:
  NLWebAgent:
    project: app/NLWebAgent
    host: azure.ai.agent
    language: python
    config:
      container:
        resources:
          cpu: '1'
          memory: 2Gi
        scale:
          maxReplicas: 3
          minReplicas: 1
infra:
  path: infra
  module: main
hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/create_app.ps1
      interactive: true
    posix:
      shell: sh
      run: ./scripts/create_app.sh
      interactive: true
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/load_data.ps1
      interactive: true
    posix:
      shell: sh
      run: ./scripts/load_data.sh
      interactive: true
metadata:
  template: nlweb-agent-demo@0.0.1-beta
